name: CI — targeting-service

on:
  push:
    branches:
      - main
    paths:
      - "services/targeting/**"
      - ".github/workflows/ci-targeting.yml"
  pull_request:
    branches:
      - main
    paths:
      - "services/targeting/**"

permissions:
  contents: write

jobs:
  ci:
    name: Call reusable pipeline
    uses: ./.github/workflows/ci-reusable.yml

    with:
      service: targeting
      language: python
      working_directory: services/targeting

    secrets: inherit
